<div class="tb-demo">
	<p class="tb-note">薄い青の部分が、文字の箱（行の高さ）です。</p>
	<div class="tb-grid">
		<section class="tb-col">
			<h3>指定なし</h3>
			<div class="tb-row">
				<button type="button" class="tb-button"><span class="tb-text">Save</span></button>
				<button type="button" class="tb-button"><span class="tb-text">保存する</span></button>
			</div>
			<div class="tb-card">
				<h4 class="tb-text">Title 見出し</h4>
				<p>カードの上の余白は padding の 16px だけのはずが、見出しの上に空きが足されて広く見えます。</p>
			</div>
		</section>
		<section class="tb-col tb-trim">
			<h3>text-box: trim-both cap alphabetic</h3>
			<div class="tb-row">
				<button type="button" class="tb-button"><span class="tb-text">Save</span></button>
				<button type="button" class="tb-button"><span class="tb-text">保存する</span></button>
			</div>
			<div class="tb-card">
				<h4 class="tb-text">Title 見出し</h4>
				<p>見出しの上の空きが削られ、上の余白が padding の 16px どおりになります。</p>
			</div>
		</section>
	</div>
</div>
