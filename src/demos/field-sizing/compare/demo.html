<div class="sizing-demo">
	<p class="sizing-note"><span class="sizing-note-label">操作</span>左右の入力欄に文字を入力して、大きさの変わり方を比べてください。</p>
	<div class="sizing-grid">
		<div class="sizing-col">
			<h3>field-sizing: fixed（既定値）</h3>
			<textarea name="fixed-textarea">複数行の文章を入力すると、スクロールバーが出ます。</textarea>
			<input type="text" name="fixed-input" value="山田" />
			<select name="fixed-select">
				<option>東京</option>
				<option>北海道 札幌市 中央区</option>
			</select>
		</div>
		<div class="sizing-col sizing-content">
			<h3>field-sizing: content</h3>
			<textarea name="content-textarea">複数行の文章を入力すると、高さが伸びます。</textarea>
			<input type="text" name="content-input" value="山田" />
			<select name="content-select">
				<option>東京</option>
				<option>北海道 札幌市 中央区</option>
			</select>
		</div>
	</div>
</div>
