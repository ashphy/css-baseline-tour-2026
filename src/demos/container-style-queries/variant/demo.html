<div class="variant-demo">
	<label class="variant-control">
		--variant の値
		<select name="variant">
			<option value="default">default</option>
			<option value="featured">featured</option>
			<option value="sale">sale</option>
		</select>
	</label>
	<!-- @key -->
	<div class="variant-card" style="--variant: default">
		<div class="variant-inner">
			<span class="variant-badge"></span>
			<h3>ワイヤレスイヤホン</h3>
			<p>ノイズキャンセリング対応。最大 24 時間再生。</p>
			<button type="button" class="variant-button">カートに入れる</button>
		</div>
	</div>
	<!-- @end -->
</div>
