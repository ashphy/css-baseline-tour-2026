<div class="theme-demo">

	<div style="--theme: light">
		<div class="theme-panel">
			<p>外側: --theme: light</p>
			<button type="button" class="theme-button">ボタン</button>

			<div style="--theme: dark">
				<div class="theme-panel">
					<p>中: --theme: dark</p>
					<button type="button" class="theme-button">ボタン</button>

					<div style="--theme: light">
						<div class="theme-panel">
							<p>内側: --theme: light</p>
							<button type="button" class="theme-button">ボタン</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- @end -->
</div>
