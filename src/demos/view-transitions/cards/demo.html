<div class="cards-demo">
	<div class="cards-toolbar">
		<button type="button" data-action="shuffle">シャッフル</button>
		<button type="button" data-action="sort">番号順</button>
		<button type="button" data-action="filter">奇数を出し入れ</button>
	</div>
	<ul class="cards">
		<!-- @key -->
		<li class="card" style="view-transition-name: card-1; --hue: 20">1</li>
		<li class="card" style="view-transition-name: card-2; --hue: 50">2</li>
		<!-- @end -->
		<li class="card" style="view-transition-name: card-3; --hue: 80">3</li>
		<li class="card" style="view-transition-name: card-4; --hue: 140">4</li>
		<li class="card" style="view-transition-name: card-5; --hue: 170">5</li>
		<li class="card" style="view-transition-name: card-6; --hue: 200">6</li>
		<li class="card" style="view-transition-name: card-7; --hue: 230">7</li>
		<li class="card" style="view-transition-name: card-8; --hue: 260">8</li>
		<li class="card" style="view-transition-name: card-9; --hue: 290">9</li>
		<li class="card" style="view-transition-name: card-10; --hue: 320">10</li>
		<li class="card" style="view-transition-name: card-11; --hue: 350">11</li>
		<li class="card" style="view-transition-name: card-12; --hue: 0">12</li>
	</ul>
</div>
